
name: AQI Prediction API Tests

on:
  push:
    branches:
      - feature/aqi-prediction-integration
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AirSense-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pandas scikit-learn joblib requests pytest httpx

      - name: Run prediction API tests
        run: python -m pytest test_prediction_api.py -v
